kind = "web"
previewPath = "/"
title = "GATORPOWER-AID"
version = "1.0.0"
id = "artifacts/gatorpoweraid"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20185

[services.development]
run = "pnpm --filter @workspace/gatorpoweraid run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gatorpoweraid", "run", "build" ]
publicDir = "artifacts/gatorpoweraid/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20185"
BASE_PATH = "/"
